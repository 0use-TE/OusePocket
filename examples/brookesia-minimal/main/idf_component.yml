  espressif/brookesia_service_display:
    version: "0.8.*"
    override_path: ../../../.reference/esp-brookesia/service/media/brookesia_service_display
  espressif/brookesia_gui_lvgl:
    version: "0.8.*"
    override_path: ../../../components/brookesia_gui_lvgl
  espressif/brookesia_runtime_js:
    version: "0.8.*"
    override_path: ../../../.reference/esp-brookesia/runtime/brookesia_runtime_js
  espressif/brookesia_system_super:
    version: "0.8.*"
    override_path: ../../../components/brookesia_system_super
  espressif/brookesia_system_core:
    version: "0.8.*"
    override_path: ../../../components/brookesia_system_core
  espressif/brookesia_app_settings:
    version: "0.8.*"
    override_path: ../../../components/brookesia_app_settings
  espressif/brookesia_service_audio:
    version: "0.8.*"
