version: "0.8.3"
description: ESP-Brookesia handheld square-screen system shell.
url: https://github.com/espressif/esp-brookesia/tree/master/system/brookesia_system_super
repository: https://github.com/espressif/esp-brookesia.git
issues: https://github.com/espressif/esp-brookesia/issues
dependencies:
  espressif/brookesia_gui_lvgl:
    version: "0.8.*"
    override_path: ../brookesia_gui_lvgl
    require: public
  espressif/brookesia_system_core:
    version: "0.8.*"
    override_path: ../../.reference/esp-brookesia/system/brookesia_system_core
    require: public

  espressif/brookesia_service_storage:
    version: "0.8.*"
    override_path: ../../.reference/esp-brookesia/service/system/brookesia_service_storage
    require: private

  espressif/brookesia_service_display:
    version: "0.8.*"
    override_path: ../../.reference/esp-brookesia/service/media/brookesia_service_display
    require: private

  espressif/brookesia_service_wifi:
    version: "0.8.*"
    override_path: ../../.reference/esp-brookesia/service/network/brookesia_service_wifi
    require: private

  espressif/brookesia_service_sntp:
    version: "0.8.*"
    override_path: ../../.reference/esp-brookesia/service/network/brookesia_service_sntp
    require: private

  espressif/brookesia_service_audio:
    version: "0.8.*"
    override_path: ../../.reference/esp-brookesia/service/media/brookesia_service_audio
    require: private
