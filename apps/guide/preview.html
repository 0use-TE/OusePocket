<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>使用说明 · 预览</title>
  <style>
    body { margin: 0; background: #d8dbe2; font: 16px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; display: grid; place-items: center; min-height: 100vh; }
    .phone { width: 320px; height: 480px; background: #f5f6f8; border-radius: 28px; box-shadow: 0 18px 40px #0003; padding: 28px 12px 18px; box-sizing: border-box; }
    .title { font-size: 22px; margin: 0 0 10px; color: #2c2d2f; }
    .card { background: #fff; border: 1px solid #c5c7ce; border-radius: 16px; padding: 14px; height: calc(100% - 46px); box-sizing: border-box; overflow: auto; }
    .card p { margin: 0 0 10px; color: #2c2d2f; }
    .repo { color: #0f87cc; }
    .author { color: #6b6c70; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="phone">
    <h1 class="title">使用说明</h1>
    <div class="card">
      <p>1. 打开「应用商店」</p>
      <p>2. 默认已连接商店，可直接浏览</p>
      <p>3. 点开应用，再点「安装」</p>
      <p>4. 系统提示里确认，等待完成</p>
      <p>5. 回到桌面打开新应用</p>
      <p>仓库地址</p>
      <p class="repo">github.com/0use-TE/OusePocket</p>
      <p class="author">作者：Ouse</p>
    </div>
  </div>
</body>
</html>
